<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>練習タイマー</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main class="app">
    <header>
      <h1>練習タイマー</h1>
      <button id="settings-toggle" type="button">設定</button>
    </header>

    <section id="timer-view" aria-label="タイマー">
      <p id="phase-name" class="phase">手順を設定してください</p>
      <div id="clock" role="timer" aria-label="残り時間">00:00</div>
      <p id="position" class="subtle"></p>
      <div class="controls">
        <button id="main-action" type="button" disabled>開始</button>
        <button id="skip" type="button" disabled>次へ</button>
        <button id="end" type="button" disabled>終了</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="total" class="subtle"></p>
      <h2>設定した流れ</h2>
      <ol id="flow"></ol>
      <div class="utility">
        <button id="permission" type="button">通知を許可</button>
        <button id="sound-test" type="button">音を試す</button>
      </div>
    </section>

    <section id="settings-view" aria-label="手順の設定" hidden>
      <h2>作業と休憩の流れ</h2>
      <p class="subtle">作業・休憩を1行ずつ追加します。上から順に進み、最後に設定した作業時間と休憩時間を交互に繰り返します。変更は次に開始するときから反映されます。</p>
      <ol id="step-list"></ol>
      <button id="add-step" type="button">＋追加</button>
      <div class="controls settings-actions">
        <button id="save-settings" type="button">保存</button>
        <button id="cancel-settings" type="button">戻る</button>
      </div>
      <p id="settings-error" role="alert"></p>
    </section>
  </main>
</body>
</html>
